<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jiaojiao Luo Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f6f3ee;
      color: #111;
    }

    header {
      padding: 64px 8vw 40px;
    }

    h1 {
      font-size: 48px;
      margin: 0;
      letter-spacing: -1px;
    }

    p {
      font-size: 18px;
      color: #666;
      max-width: 620px;
      line-height: 1.7;
    }

    .gallery {
      column-count: 3;
      column-gap: 24px;
      padding: 0 8vw 80px;
    }

    .item {
      break-inside: avoid;
      margin-bottom: 24px;
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .item img {
      width: 100%;
      display: block;
    }

    .caption {
      padding: 18px;
      font-size: 15px;
    }

    @media (max-width: 900px) {
      .gallery {
        column-count: 2;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 34px;
      }

      .gallery {
        column-count: 1;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Jiaojiao Luo</h1>
    <p>Graphic Designer / Visual Design / Editorial Design / Campaign Visuals</p>
  </header>

  <main class="gallery">
    <div class="item">
      <img src="images/destinationkit.jpg" alt="Portfolio Work">
      <div class="caption">Editorial Design / Media Kit</div>
    </div>

    <div class="item">
      <img src="images/micekit.jpg" alt="Portfolio Work">
      <div class="caption">Editorial Design / Media Kit</div>
    </div>

    <div class="item">
      <img src="images/mice2.jpg" alt="Portfolio Work">
      <div class="caption">Editorial Design / Media Kit</div>
    </div>

    <div class="item">
      <img src="images/menu1.jpg" alt="Portfolio Work">
      <div class="caption">Campaign Visual / Key Visual</div>
    </div>

    <div class="item">
      <img src="images/Kohler1.jpg" alt="Portfolio Work">
      <div class="caption">Travel Guide / Publication Design</div>
    </div>

    <div class="item">
      <img src="images/yige.jpg" alt="Portfolio Work">
      <div class="caption">Poster Series / Graphic Design</div>
    </div>
  </main>

</body>
</html>
